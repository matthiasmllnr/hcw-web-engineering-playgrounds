services:
  playgrounds-gui:
    container_name: playgrounds-gui
    build:
      context: './gui'
      dockerfile: 'image/Dockerfile'
      target: development
    volumes:
      - ./gui:/home/app/
    ports:
      - '4200:4200'
    stdin_open: true
    tty: true  
    restart: unless-stopped

  playgrounds-api:
    build:
      context: ./api
      dockerfile: image/app/Dockerfile
      target: development
    ports:
      - "3000:3000"
    volumes:
      - ./api:/home/app
    environment:
      RAILS_ENV: "development"
      RAILS_PORT: 3000

      RAILS_FRONTEND_URL: "http://localhost:4200"

      ## Other
      WEB_CONCURRENCY: 1
